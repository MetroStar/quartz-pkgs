name: epyon image

'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/epyon.yaml
    - .github/workflows/epyon-scan.yaml
    - src/epyon/**
  # Nightly rebuild so the published epyon image tracks MetroStar/epyon's main
  # branch. The build checks out epyon@main at run time, but a push to that
  # separate repo cannot fire this workflow, so without a schedule the image
  # would only refresh when src/epyon/** changes here. 07:00 UTC daily.
  # NOTE: scheduled triggers only run from the default branch, so this becomes
  # active once merged to main.
  schedule:
  - cron: '0 7 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    name: Build image

    # Self-hosted runner required: registry1.dso.mil (Ironbank) enforces an IP
    # Other image builds in this repo (nodejs, jenkins, build-tools) prove that
    # public runners can reach registry1.dso.mil. The epyon workflow is the only
    # one with a cross-repo checkout step; placing it before the Docker login
    # steps caused the Ironbank login to fail ("connection refused") — likely
    # because actions/checkout@v4 leaves a GitHub credential extraheader in the
    # runner's global git config that interferes with Docker's HTTPS credential
    # handling. Moving all Docker setup/login steps before the cross-repo
    # checkout resolves the issue (epyon source is only needed for the build
    # step, not the login steps).
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Github Packages container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to the Ironbank container registry
      uses: docker/login-action@v3
      with:
        registry: registry1.dso.mil
        username: ${{ secrets.IRONBANK_USERNAME }}
        password: ${{ secrets.IRONBANK_PASSWORD }}

    - name: Checkout Epyon
      uses: actions/checkout@v4
      with:
        repository: MetroStar/epyon
        # Epyon publishes 3.5.0 on the main branch (no v3.5.0 git tag exists)
        ref: main
        path: src/epyon/epyon
        persist-credentials: false

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/epyon
        tags: |
          type=raw,value=3.5.0
          type=raw,value=3.5.0-{{date 'YYYYMMDD'}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: src/epyon
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64

  scan:
    name: Epyon security scan
    needs: build-and-push-image
    uses: ./.github/workflows/epyon-scan.yaml
    with:
      scan_mode: full
      fail_on_critical: true
    secrets: inherit
