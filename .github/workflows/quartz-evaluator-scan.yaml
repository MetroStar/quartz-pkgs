name: Quartz Evaluator Security Scan

'on':
  workflow_call:
    inputs:
      scan_mode:
        description: "Scan mode: container, repo, or full"
        required: false
        type: string
        default: container
      fail_on_critical:
        description: "Fail the workflow if critical vulnerabilities are found"
        required: false
        type: boolean
        default: true

jobs:
  quartz-evaluator-scan:
    name: Quartz Evaluator scan (${{ inputs.scan_mode }})
    # Workflow fix: MetroStar/epyon#187. Scanner branding is pinned separately.
    uses: MetroStar/epyon/.github/workflows/epyon-scan.yml@ab22ffc47cd18aad3fe55a52fba40973dfb37cc7
    with:
      scanner_ref: 0da9ac4da2a38331786c1cf16396928fb099a8fb
      scan_mode: ${{ inputs.scan_mode }}
      fail_on_critical: ${{ inputs.fail_on_critical }}
