name: quartz-evaluator image

'on':
  workflow_dispatch: {}
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/quartz-evaluator.yaml
    - .github/workflows/quartz-evaluator-scan.yaml
    - scripts/verify-quartz-evaluator.py
    - scripts/test-quartz-evaluator-runtime.py
    - src/quartz-evaluator/**
  push:
    branches:
    - main
    paths:
    - .github/workflows/quartz-evaluator.yaml
    - .github/workflows/quartz-evaluator-scan.yaml
    - scripts/verify-quartz-evaluator.py
    - scripts/test-quartz-evaluator-runtime.py
    - src/quartz-evaluator/**

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  EVALUATOR_SOURCE_SHA: aec98b2a8d5a1302d286bb6718a589b8958a579f
  # Bump the runtime revision for packaging changes; never republish an old tag.
  EVALUATOR_IMAGE_TAG: source-aec98b2a8d5a-r1

jobs:
  validate:
    name: Verify pinned scanner patches
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Fetch pinned scanner without submodules
      run: |
        git clone --depth 1 --branch demo/quartz-evaluator --no-recurse-submodules \
          https://github.com/MetroStar/epyon.git src/quartz-evaluator/upstream
        git -C src/quartz-evaluator/upstream fetch --depth 1 origin "$EVALUATOR_SOURCE_SHA"
        git -C src/quartz-evaluator/upstream checkout --detach FETCH_HEAD
        test "$(git -C src/quartz-evaluator/upstream rev-parse HEAD)" = "$EVALUATOR_SOURCE_SHA"
    - name: Verify native-toolchain patches
      run: python3 scripts/verify-quartz-evaluator.py src/quartz-evaluator/upstream
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verify locked Sonar scanner dependencies
      run: |
        npm ci --ignore-scripts --omit=dev --prefix src/quartz-evaluator/sonar-scanner
        npm audit --omit=dev --prefix src/quartz-evaluator/sonar-scanner

  build-and-push-image:
    name: Build image
    if: github.event_name != 'pull_request'
    needs: validate

    # Self-hosted runner required: registry1.dso.mil (Ironbank) enforces an IP
    # Other image builds in this repo (nodejs, jenkins, build-tools) prove that
    # public runners can reach registry1.dso.mil. The quartz-evaluator workflow is the only
    # one with a cross-repo checkout step; placing it before the Docker login
    # steps caused the Ironbank login to fail ("connection refused") — likely
    # because actions/checkout@v4 leaves a GitHub credential extraheader in the
    # runner's global git config that interferes with Docker's HTTPS credential
    # handling. Moving all Docker setup/login steps before the cross-repo
    # checkout resolves the issue (quartz-evaluator source is only needed for the build
    # step, not the login steps).
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Github Packages container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to the Ironbank container registry
      uses: docker/login-action@v3
      with:
        registry: registry1.dso.mil
        username: ${{ secrets.IRONBANK_USERNAME }}
        password: ${{ secrets.IRONBANK_PASSWORD }}

    - name: Checkout pinned Quartz Evaluator source
      # actions/checkout@v4 fails on MetroStar/epyon because the repo has a
      # gitlink entry (.bats/bats-core) with no corresponding .gitmodules URL,
      # causing git to exit 128. Using git clone --no-recurse-submodules skips
      # submodule URL validation entirely. The token is masked in logs by
      # GitHub Actions; .git is excluded from the build context via .dockerignore
      # so the credential-bearing remote URL never enters the Docker image.
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git clone --depth 1 --branch demo/quartz-evaluator --no-recurse-submodules \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/MetroStar/epyon.git" \
          src/quartz-evaluator/upstream
        git -C src/quartz-evaluator/upstream fetch --depth 1 origin "$EVALUATOR_SOURCE_SHA"
        git -C src/quartz-evaluator/upstream checkout --detach FETCH_HEAD
        test "$(git -C src/quartz-evaluator/upstream rev-parse HEAD)" = "$EVALUATOR_SOURCE_SHA"

    - name: Verify native-toolchain patches
      run: python3 scripts/verify-quartz-evaluator.py src/quartz-evaluator/upstream

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/quartz-evaluator
        tags: |
          type=raw,value=${{ env.EVALUATOR_IMAGE_TAG }}
        labels: |
          org.opencontainers.image.source=https://github.com/MetroStar/epyon
          org.opencontainers.image.revision=${{ env.EVALUATOR_SOURCE_SHA }}

    - name: Preserve an already published immutable source tag
      id: delivery
      run: |
        image="${REGISTRY}/${IMAGE_NAME,,}/quartz-evaluator:${EVALUATOR_IMAGE_TAG}"
        if docker buildx imagetools inspect "$image" --format '{{json .Image}}' \
            > image-configs.json 2> image-inspect-error.log; then
          jq -e --arg source "$EVALUATOR_SOURCE_SHA" '
            keys == ["linux/amd64", "linux/arm64"] and
            all(.[]; .config.Labels["org.opencontainers.image.revision"] == $source)
          ' image-configs.json
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Reusing the verified, published source tag without overwriting it."
        elif grep -Fq "$image: not found" image-inspect-error.log; then
          echo "exists=false" >> "$GITHUB_OUTPUT"
        else
          cat image-inspect-error.log >&2
          exit 1
        fi

    - name: Build and push Docker image
      if: steps.delivery.outputs.exists != 'true'
      uses: docker/build-push-action@v6
      with:
        context: src/quartz-evaluator
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64

  runtime:
    name: Native runtime (${{ matrix.arch }})
    needs: build-and-push-image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-latest
        - arch: arm64
          runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Test published image as an unprivileged native process
      run: |
        image="${REGISTRY}/${IMAGE_NAME,,}/quartz-evaluator:${EVALUATOR_IMAGE_TAG}"
        docker run --rm --platform "linux/${{ matrix.arch }}" \
          --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges \
          --read-only --tmpfs /tmp:rw,size=256m \
          -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
          -v "$PWD/scripts/test-quartz-evaluator-runtime.py:/tests/runtime.py:ro" \
          --entrypoint python3 "$image" /tests/runtime.py

  scan:
    name: Quartz Evaluator security scan
    needs: build-and-push-image
    uses: ./.github/workflows/quartz-evaluator-scan.yaml
    with:
      scan_mode: full
      fail_on_critical: true
    secrets: inherit
