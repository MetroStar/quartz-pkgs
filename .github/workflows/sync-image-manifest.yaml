name: Sync image manifest

'on':
  schedule:
    - cron: '17 * * * *'
  pull_request:
    paths:
      - .github/workflows/sync-image-manifest.yaml
      - scripts/test-manifest-sync.py
  workflow_dispatch:
    inputs:
      bigbang_version:
        description: 'BigBang version (auto-detected from quartz values if empty)'
        required: false
        type: string
      quartz_ref:
        description: 'Quartz repo ref to read values from'
        required: false
        default: 'main'
        type: string
  repository_dispatch:
    types: [sync-images]

permissions:
  contents: read

concurrency:
  group: image-manifest-sync-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  validate-workflow:
    name: Validate manifest sync workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tokenless synchronization contract
        run: |
          python3 -m pip install 'PyYAML>=6,<7'
          python3 scripts/test-manifest-sync.py

  extract-and-update:
    name: Extract images and update manifest
    needs: validate-workflow
    if: github.repository == 'MetroStar/quartz-pkgs' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      packages: read
    env:
      QUARTZ_REF: ${{ inputs.quartz_ref || github.event.client_payload.quartz_ref || 'main' }}
    steps:
      - name: Checkout quartz-pkgs
        uses: actions/checkout@v4
        with:
          ref: main
          path: quartz-pkgs

      - name: Checkout quartz
        uses: actions/checkout@v4
        with:
          repository: MetroStar/quartz
          ref: ${{ env.QUARTZ_REF }}
          ssh-key: ${{ secrets.QUARTZ_SOURCE_SSH_KEY }}
          persist-credentials: false
          path: quartz

      - name: Install tools
        run: |
          # Install yq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          # Helm is pre-installed on ubuntu-latest

      - name: Log in to Ironbank registry (for OCI chart pulls)
        if: env.IRONBANK_USERNAME != ''
        env:
          IRONBANK_USERNAME: ${{ secrets.IRONBANK_USERNAME }}
          IRONBANK_PASSWORD: ${{ secrets.IRONBANK_PASSWORD }}
        run: |
          helm registry login registry1.dso.mil \
            --username "$IRONBANK_USERNAME" \
            --password "$IRONBANK_PASSWORD"

      - name: Run image extraction
        env:
          QUARTZ_VALUES_PATH: ${{ github.workspace }}/quartz/chart/values.yaml
          BIGBANG_VERSION: ${{ inputs.bigbang_version || github.event.client_payload.bigbang_version || '' }}
          OUTPUT_PATH: ${{ github.workspace }}/quartz-pkgs/src/ironbank/image-manifest.json
        run: |
          chmod +x quartz-pkgs/scripts/extract-images.sh
          quartz-pkgs/scripts/extract-images.sh

      - name: Check for changes
        id: changes
        working-directory: quartz-pkgs
        run: |
          if git diff --quiet src/ironbank/image-manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to image manifest"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Image manifest updated:"
            git diff --stat src/ironbank/image-manifest.json
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        working-directory: quartz-pkgs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/ironbank/image-manifest.json
          git commit -m "chore: sync image-manifest.json from quartz values

          Auto-generated by sync-image-manifest workflow.
          BigBang version: ${BIGBANG_VERSION:-auto-detected}
          Quartz ref: ${QUARTZ_REF}"
          git push

      - name: Start image mirroring
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ironbank.yaml --repo "$GITHUB_REPOSITORY" --ref main
